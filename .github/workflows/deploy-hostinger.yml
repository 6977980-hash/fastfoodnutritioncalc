name: Deploy to Hostinger

# Uploads the ffnc-site-fixes plugin to the WordPress plugins folder on
# Hostinger over FTP. Only that one folder is touched; WordPress core,
# themes, uploads and other plugins are never changed or deleted.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER    e.g. ftp.fastfoodnutritioncalc.com or the IP from hPanel
#   FTP_USERNAME  the FTP username from hPanel (e.g. u123456789)
#   FTP_PASSWORD  the FTP password
# Optional repository variable:
#   FTP_SERVER_DIR  remote folder, default public_html/wp-content/plugins/ffnc-site-fixes/
#   FTP_PROTOCOL    ftps (default) or ftp if the server refuses TLS

on:
  push:
    branches: [main]
    paths:
      - 'ffnc-site-fixes/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: find ffnc-site-fixes -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check FTP secrets
        id: secrets
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::warning::FTP_SERVER secret is not set, skipping deploy. Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD in repo settings."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload plugin over FTP
        if: steps.secrets.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./ffnc-site-fixes/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/wp-content/plugins/ffnc-site-fixes/' }}
